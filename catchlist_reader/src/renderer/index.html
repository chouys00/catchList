<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>CatchList 閱讀器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="回到清單頂端">
        <span class="brand-mark">C</span>
        <span><strong>CatchList</strong><small>私人觀影與遊戲清單</small></span>
      </button>
      <nav class="tabs" aria-label="內容類型">
        <button class="tab active" data-media="games">遊戲</button>
        <button class="tab" data-media="anime">動畫</button>
        <button class="tab" data-media="movies">電影</button>
      </nav>
      <button class="folder-button" data-action="choose-folder" title="更換 Markdown 資料夾">
        <span class="folder-dot"></span><span id="folderLabel">選擇資料夾</span>
      </button>
    </header>

    <main id="app" class="workspace" aria-live="polite"></main>
  </div>

  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <p class="eyebrow" id="dialogEyebrow">請確認</p>
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button subtle">取消</button>
        <button value="confirm" id="dialogConfirm" class="button primary">確認</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="preview.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
