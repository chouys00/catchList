[package]
name = "catchlist-reader"
version = "1.0.1"
description = "CatchList Markdown desktop reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
url = "2"
open = "5"

[dev-dependencies]
tempfile = "3"
